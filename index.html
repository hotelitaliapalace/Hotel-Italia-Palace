<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111815">
  <meta name="description" content="Explore Hotel Italia Palace through an immersive virtual tour.">
  <title>Virtual Tour · Hotel Italia Palace</title>
  <link rel="stylesheet" href="vendor/reset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#tourNavigation">Skip to tour navigation</a>

  <main id="tour" class="tour-shell">
    <div id="pano" aria-label="360 degree virtual tour" role="application"></div>

    <aside id="desktopNavigation" class="desktop-navigation" aria-label="Tour navigation">
      <div class="navigation-brand">
        <span class="navigation-eyebrow">Hotel Italia Palace</span>
        <strong>Virtual Tour</strong>
      </div>
      <nav id="tourNavigation" class="group-navigation" aria-label="Desktop rooms and hotel areas"></nav>
      <div class="desktop-route" role="group" aria-label="Tour route">
        <button id="desktopPrevious" class="route-button route-button-previous" type="button"><span class="visually-hidden">Previous scene</span></button>
        <button id="desktopNext" class="route-button route-button-next" type="button"><span class="visually-hidden">Next scene</span></button>
      </div>
    </aside>

    <header class="scene-header">
      <div class="scene-heading" aria-live="polite" aria-atomic="true">
        <span id="currentGroup" class="scene-group">Superior Suite I</span>
        <h1 id="currentScene" class="scene-name">Overview</h1>
      </div>
      <button id="motionToggle" class="icon-button motion-toggle" type="button" aria-pressed="false">
        <span class="motion-icon" aria-hidden="true"></span>
        <span class="visually-hidden motion-label">Start automatic rotation</span>
      </button>
    </header>

    <div class="mobile-route" role="group" aria-label="Tour controls">
      <button id="mobilePrevious" class="route-button route-button-previous" type="button"><span class="visually-hidden">Previous scene</span></button>
      <button id="mobileExplore" class="explore-button" type="button" aria-controls="mobileSheet" aria-expanded="false">
        <span class="explore-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Explore</span>
      </button>
      <button id="mobileNext" class="route-button route-button-next" type="button"><span class="visually-hidden">Next scene</span></button>
    </div>

    <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
    <section id="mobileSheet" class="mobile-sheet" aria-label="Choose an area" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div>
          <span class="navigation-eyebrow">Virtual Tour</span>
          <h2>Choose an area</h2>
        </div>
        <button id="closeSheet" class="close-button" type="button" aria-label="Close area menu">×</button>
      </div>
      <nav id="mobileNavigation" class="mobile-navigation" aria-label="Mobile rooms and hotel areas"></nav>
    </section>

    <div id="loadingStatus" class="loading-status" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading panorama</span>
    </div>
  </main>

  <noscript>
    <p class="no-script">JavaScript is required to view this virtual tour.</p>
  </noscript>

  <script src="vendor/screenfull.min.js"></script>
  <script src="vendor/bowser.min.js"></script>
  <script src="vendor/marzipano.js"></script>
  <script src="data.js"></script>
  <script src="tour-config.js"></script>
  <script src="index.js"></script>
</body>
</html>
